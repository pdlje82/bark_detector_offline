name: bark-detector-offline
channels:
  - conda-forge
  - pytorch
dependencies:
  - python=3.11
  - ffmpeg
  - libsndfile
  - numpy
  - librosa
  - pysoundfile   # conda-forge name for the `soundfile` PyPI package
  - mutagen
  - pyyaml
  - tqdm
  - pip
  # PyTorch CPU build. If this solve is slow/fails, install torch afterwards
  # following https://pytorch.org (CPU variant) inside the activated env.
  - pytorch-cpu
  - pip:
      - panns-inference
