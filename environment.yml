name: bark-detector-offline
channels:
  - conda-forge
  - pytorch
dependencies:
  - python=3.11
  - ffmpeg
  - libsndfile
  - numpy
  - librosa
  - pysoundfile   # conda-forge name for the `soundfile` PyPI package
  - scikit-learn  # lightweight classifier for per-dog identification
  - joblib        # persists the trained dog classifier
  - flask         # local label server (python -m barkdetect serve)
  - mutagen
  - pyyaml
  - tqdm
  - tzdata        # IANA timezone DB — required by zoneinfo on Windows
  - pip
  # PyTorch CPU build. If this solve is slow/fails, install torch afterwards
  # following https://pytorch.org (CPU variant) inside the activated env.
  - pytorch-cpu
  - pip:
      - panns-inference
