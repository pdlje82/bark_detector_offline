# Bark Detector Offline — configuration
#
# The pipeline takes NO command-line arguments. Everything is set here.
#   Run:                     python -m barkdetect
#   Use a different config:  BARKDETECT_CONFIG=other.yml python -m barkdetect
#
# Paths are relative to the project root (or absolute).

run:
  source: "D:/Projects/dog_bark/temp_input"           # SD card path/folder to ingest MP3s from (used by 'ingest')
  steps:                      # stages to execute, in this order
    - ingest
    - analyze
    - identify
    - export
    - publish
  reprocess: false            # true = re-analyze ALL recordings (re-cut snippets/embeddings),
                              # preserving labels; use after changing snippet settings

# Local labeling server (python -m barkdetect serve). The frontend reads/writes
# human labels directly in barks.db via this server; localhost-only by default.
serve:
  host: 127.0.0.1
  port: 8000

paths:
  # Base dir that the relative paths below resolve against. Set this to your
  # project/data directory so archive/db/snippets/export live OUTSIDE the git
  # repo. null/empty = use the repo dir (where config.yml lives).
  root: "D:/Projects/dog_bark"
  archive_dir: data/archive   # immutable copies of the original MP3s
  snippets_dir: data/snippets # per-event audio clips (served to the frontend)
  db_path: data/barks.db      # SQLite source of truth
  export_dir: data/export     # results JSON for the frontend
  site_dir: data/site         # 'publish' bundle: index.html + results.json + snippets (deploy unit)

# Timezone of the Zoom H6 recorder AND this PC. FAT timestamps on the SD card
# are stored in local wall-clock time; this must match the recorder's clock.
timezone: Europe/Berlin

model:
  device: cpu                 # cpu | cuda
  name: "PANNs Cnn14_DecisionLevelMax"
  version: audioset
  checkpoint_path: null       # null = auto-download the default PANNs checkpoint (~300 MB)

audio:
  sample_rate: 32000          # PANNs native rate — do not change (see README note)
  window_seconds: 60          # streaming window size (keeps RAM flat on 24h files)
  min_window_seconds: 1.0     # skip trailing windows shorter than this

# Normalization is applied per window BEFORE detection so quiet recordings are
# boosted to a consistent level. The exact values used are recorded per
# recording in the database and echoed in results.json for chain-of-custody.
normalization:
  enabled: true
  target_peak: 0.9            # scale window so its peak reaches this (0..1)
  max_gain: 20.0              # cap amplification (linear) to avoid blowing up faint noise
  noise_floor: 0.005          # if window peak < this, treat as silence and do NOT amplify

detection:
  threshold: 0.15             # frame score to count as "dog sound" (LOW = high recall)
  min_event_seconds: 0.15     # discard events shorter than this
  merge_gap_seconds: 0.4      # merge two hot spans separated by less than this
  dog_classes:                # AudioSet class names treated as dog barking
    - Dog
    - Bark
    - Bow-wow
    - Yip
    - Howl
    - Growling
    - Whimper (dog)

# Per-event loudness, measured from the RAW (un-normalized) audio at ~10 ms
# resolution. The absolute value (linear amplitude / dBFS) is stored; the 0..1
# "relative" value is derived at export time — 1.0 = the loudest bark in scope.
intensity:
  metric: rms                 # rms (perceived energy) | peak (max amplitude)
  scope: per_file             # per_file (loudest bark in each file = 1.0) | global (across all files)

# Per-dog identification. A frozen embedding is computed per bark; a lightweight
# classifier is trained on YOUR labels (exported from the website as labels.json)
# and predicts a dog for every event. Human labels are authoritative; model
# predictions are advisory ("suggested, review").
identification:
  enabled: true
  embedding: librosa            # librosa | panns | aves  (swappable)
  classifier: logreg            # logreg | knn
  min_labels_per_dog: 5         # need at least this many labels per dog before training
  labels_path: data/labels.json # where the website's exported labels are dropped
  model_path: data/models/dog_clf.joblib
  dogs:                         # roster — REAL NAMES (fill these in)
    - Socke
    - Clooney
    - Zareth
    - Pastor
    - Podenco
    - Podenca
    - PerroCarmen
    - PerroLejano

ingest:
  file_extensions: [".mp3"]              # which files to pick up from the source
  timestamp_source_label: sdcard_ctime  # how the recording start time was derived
  hash_prefix_len: 12                    # length of the sha prefix used in archive filenames
  # Archive filename pattern. Tokens: {start}=recording start (local, yymmdd_hhmm),
  # {hash}=short sha, {name}=original filename.
  archive_name_template: "{start}_{hash}_{name}"
  hash_chunk_bytes: 1048576              # read size when hashing files
  # Warn if the file's modified time disagrees with (start + duration) by more
  # than this many seconds — flags a wrong recorder clock or timestamps lost on
  # copy, which would undermine every timestamp in the evidence.
  clock_drift_warn_seconds: 120

snippets:
  padding_seconds: 2.0        # audio context added before/after each event
  quality: 5                  # libmp3lame VBR quality (0=best/large .. 9=worst/small)
  codec: libmp3lame           # ffmpeg audio codec for the clip
  channels: 1                 # snippet channel count
  extension: mp3              # snippet file extension
  # Clip filename (kept under a per-recording <hash>/ folder). Tokens:
  # {date}=ddmmyy, {time}=hhmmss (bark's local time), {ms}=offset in file (unique),
  # {dbfs}=loudness e.g. -29dBFS, {intensity}=linear amp, {hash}=short sha.
  name_template: "{date}_{time}_{ms}_{dbfs}"
  # Loudness-normalize clips (ffmpeg loudnorm) so faint barks in quiet recordings
  # are audible on review. The archived original is never modified; this only
  # affects the listening clips. Recorded in results.json provenance.
  normalize: true
  normalize_target_lufs: -16.0  # EBU R128 integrated loudness target (higher = louder)

coverage:
  merge_gap_seconds: 5.0      # recordings within this gap are treated as contiguous
  night_start_hour: 22        # local hour night window begins
  night_end_hour: 6           # local hour night window ends

export:
  filename: results.json      # output file written into export_dir

logging:
  level: INFO                 # DEBUG | INFO | WARNING (DEBUG adds per-window position)
  progress_bar: true          # live tqdm bar per file; set false for headless/cron runs
  log_file: data/processing.log  # append a timestamped audit log; null = console only
